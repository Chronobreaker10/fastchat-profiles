services:
  fastapi:
    build: .
    container_name: fastchat_profiles
    restart: unless-stopped
    env_file: .env
    volumes:
      - logs:/app/logs
    depends_on:
      postgres:
        condition : service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8002:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/docs', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 256M
    networks:
      - fastchat-net

  postgres:
    image: postgres:18-alpine
    container_name: fastchat_profiles_db
    environment:
      POSTGRES_USER: ${DATABASE__USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE__PASSWORD:-postgres}
      POSTGRES_DB: ${DATABASE__NAME:-postgres}
      POSTGRES_PORT: ${DATABASE__PORT:-5432}
      PGDATA: /var/lib/postgresql/data/pgdata
    restart: unless-stopped
    ports:
      - "5452:${DATABASE__PORT:-5432}"
    volumes:
      - pgdata:/var/lib/postgresql/data/pgdata
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DATABASE__USER:-postgres}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - fastchat-net

  redis:
    image: redis:8-alpine
    container_name: fastchat_profiles_cache
    ports:
      - "6389:6379"
    restart: unless-stopped
    command: [ "redis-server", "--appendonly", "yes" ]
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli ping | grep PONG" ]
      interval: 3s
      timeout: 3s
      retries: 5
    networks:
      - fastchat-net

volumes:
  pgdata:
    driver: local
  redis-data:
    driver: local
  logs:
    driver: local

networks:
  fastchat-net:
    external: true
